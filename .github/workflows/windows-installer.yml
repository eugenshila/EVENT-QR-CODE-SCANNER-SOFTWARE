name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a09710-event-qr-code-scanner-software

permissions:
  contents: write

jobs:
  build-msi:
    name: Package Beacon Boys Windows MSI
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MSI
        shell: pwsh
        run: |
          npm run desktop:build 2>&1 | Tee-Object -FilePath build-msi.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''

      - name: Publish MSI build diagnostics when packaging fails
        if: failure()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-msi.log
          git commit -m "ci: record MSI build diagnostics [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: beacon-boys-windows-msi
          path: release/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Publish MSI release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ github.run_number }}
          name: Beacon Boys Event Check-in Desktop v${{ github.run_number }}
          body: |
            Windows x64 MSI installer for the Beacon Boys Event Check-in desktop app.

            The desktop app uses loopback port 5180 by default and automatically moves to the next available port when needed.
          files: release/*.msi
          draft: false
          prerelease: true
