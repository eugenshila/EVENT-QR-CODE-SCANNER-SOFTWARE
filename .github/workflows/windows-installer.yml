name: Build Windows MSI

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a09710-event-qr-code-scanner-software

permissions:
  contents: read

jobs:
  build-msi:
    name: Package Beacon Boys Windows MSI
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MSI
        run: npm run desktop:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ''

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: beacon-boys-windows-msi
          path: release/*.msi
          if-no-files-found: error
          retention-days: 30
